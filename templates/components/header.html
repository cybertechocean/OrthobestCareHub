{% load static %}
<header class="site-header">
  <div class="container">
    <div class="header-inner">
      
      <!-- Brand Logo -->
      <a href="{% url 'core:home' %}" class="brand-logo" aria-label="Orthobest Care Hub Home">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <path d="M12 2v20M2 12h20"/>
        </svg>
        <span>Orthobest <span style="color: var(--primary);">Care Hub</span></span>
        <span class="brand-badge">KE</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="{% url 'core:home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'products:shop' %}" class="nav-link {% if 'shop' in request.path %}active{% endif %}">Shop Products</a>
        <a href="{% url 'content_hub:services' %}" class="nav-link {% if 'services' in request.path %}active{% endif %}">Services</a>
        <a href="{% url 'content_hub:blog_list' %}" class="nav-link {% if 'blog' in request.path %}active{% endif %}">Resources & Guides</a>
        <a href="{% url 'content_hub:about' %}" class="nav-link {% if 'about' in request.path %}active{% endif %}">About Us</a>
        <a href="{% url 'leads:contact' %}" class="nav-link {% if 'contact' in request.path %}active{% endif %}">Contact</a>
      </nav>

      <!-- Search Bar Widget (Desktop/Tablet) -->
      <div class="search-widget">
        <form action="{% url 'products:shop' %}" method="get">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" name="q" class="search-input" placeholder="Search wheelchairs, braces, supports..." autocomplete="off" value="{{ request.GET.q|default:'' }}">
        </form>
      </div>

      <!-- Action Buttons (Account, Wishlist/Track, Cart) -->
      <div class="header-actions">
        <!-- Order Track -->
        <a href="{% url 'orders:order_track' %}" class="action-btn" title="Track Your Order" aria-label="Track Order">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13"></rect>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
            <circle cx="5.5" cy="18.5" r="2.5"></circle>
            <circle cx="18.5" cy="18.5" r="2.5"></circle>
          </svg>
        </a>

        <!-- Account -->
        {% if user.is_authenticated %}
          <a href="{% url 'accounts:dashboard' %}" class="action-btn" title="My Account" aria-label="My Account">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </a>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="action-btn" title="Login / Register" aria-label="Login">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
          </a>
        {% endif %}

        <!-- Cart Drawer Toggle -->
        <button type="button" class="action-btn" data-toggle-cart title="Shopping Cart" aria-label="View Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="badge-count">{{ cart_total_count|default:0 }}</span>
        </button>
      </div>

    </div>
  </div>
</header>
