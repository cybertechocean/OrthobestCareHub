{% load static %}
<!-- Sticky Mobile Bottom Action Bar (Mobile View ONLY: SHOP | CALL | LOCATE) -->
<nav class="mobile-action-bar" aria-label="Mobile Quick Action Navigation" id="mobileActionBar">
  <div class="mobile-action-bar__container">
    
    <!-- Action 1: SHOP -->
    <a href="{% url 'products:shop' %}" 
       class="mobile-action-btn mobile-action-btn--shop {% if 'shop' in request.path %}active{% endif %}" 
       aria-label="Shop Products Catalog">
      <span class="mobile-action-btn__icon-box">
        <i data-lucide="shopping-bag" class="lucide-icon" aria-hidden="true"></i>
        <!-- Inline SVG fallback for immediate rendering -->
        <svg class="svg-fallback" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span class="mobile-action-btn__label">SHOP</span>
    </a>

    <!-- Action 2: CALL -->
    <a href="tel:{{ site_settings.phone_primary|default:'+254719160398'|cut:' ' }}" 
       class="mobile-action-btn mobile-action-btn--call" 
       aria-label="Call Orthobest Care Hub ({{ site_settings.phone_primary|default:'+254 719 160 398' }})">
      <span class="mobile-action-btn__icon-box">
        <i data-lucide="phone-call" class="lucide-icon" aria-hidden="true"></i>
        <!-- Inline SVG fallback for immediate rendering -->
        <svg class="svg-fallback" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          <path d="M14.05 2a9 9 0 0 1 8 7.94"/>
          <path d="M14.05 6A5 5 0 0 1 18 10"/>
        </svg>
      </span>
      <span class="mobile-action-btn__label">CALL</span>
    </a>

    <!-- Action 3: LOCATE -->
    <a href="{% url 'leads:contact' %}#location" 
       class="mobile-action-btn mobile-action-btn--locate {% if 'contact' in request.path %}active{% endif %}" 
       aria-label="Locate Our Nairobi CBD Showroom">
      <span class="mobile-action-btn__icon-box">
        <i data-lucide="map-pin" class="lucide-icon" aria-hidden="true"></i>
        <!-- Inline SVG fallback for immediate rendering -->
        <svg class="svg-fallback" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <span class="mobile-action-btn__label">LOCATE</span>
    </a>

  </div>
</nav>
