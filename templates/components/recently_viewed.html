{% load humanize static %}
{% if recently_viewed_products %}
<section class="recently-viewed-section" style="margin-top: 4rem; padding-top: 2.5rem; border-top: 1.5px solid var(--border-color);">
  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
    <div>
      <div class="section-tag">Browsing History</div>
      <h2 style="font-size: 1.35rem; color: var(--secondary); margin-top: 0.25rem;">Recently Viewed Products</h2>
    </div>
    <form action="{% url 'products:clear_history' %}" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit" style="background: none; border: none; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; text-decoration: underline;">
        Clear History
      </button>
    </form>
  </div>

  <div class="product-grid">
    {% for product in recently_viewed_products %}
      {% include 'components/product_card.html' with product=product %}
    {% endfor %}
  </div>
</section>
{% endif %}
